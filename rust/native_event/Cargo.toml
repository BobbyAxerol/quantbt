[package]
name = "quantbt-native"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
name = "_quantbt_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
quantbt-domain = { path = "../crates/quantbt-domain" }
quantbt-engine = { path = "../crates/quantbt-engine" }

[dev-dependencies]
proptest = "1.6"
