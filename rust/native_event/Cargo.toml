[package]
name = "quantbt-native"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
name = "_quantbt_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
overflow-checks = false
