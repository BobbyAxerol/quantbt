[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "quantbt-native"
version = "0.3.0"
description = "Optional PyO3 accelerator for quantbt-engine native event execution"
requires-python = ">=3.11"

[tool.maturin]
bindings = "pyo3"
module-name = "_quantbt_native"
manifest-path = "Cargo.toml"
