[build-system]
requires = ["setuptools>=82,<83", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbt-engine"
version = "1.0.7"
description = "Transparent, high-performance quantitative backtesting engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "BobbyAxerol", email = "vugioan11022002@gmail.com" },
]
keywords = [
    "backtesting",
    "quant",
    "trading",
    "numba",
    "portfolio",
    "event-driven",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2.6,<2.3",
    "pandas>=2.3.3,<2.4",
    "numba>=0.65.1,<0.66",
]

[project.optional-dependencies]
optimization = [
    "optuna>=4.8.0,<4.9",
    "arch>=8.0.0,<8.1",
    "scikit-learn>=1.8.0,<1.9",
]
reports = [
    "quantstats==0.0.81",
]
viz = [
    "matplotlib>=3.10.9,<3.11",
    "seaborn>=0.13.2,<0.14",
]
validation = [
    "nautilus-trader>=1.230.0,<1.231; python_version >= '3.12'",
]
# The API 0.4 PyO3 package is built by the native workflow but is not yet a
# public dependency. Keep this empty until quantbt-native passes the public
# manylinux wheel and clean-install gates.
native = []
all = [
    "optuna>=4.8.0,<4.9",
    "arch>=8.0.0,<8.1",
    "scikit-learn>=1.8.0,<1.9",
    "quantstats==0.0.81",
    "matplotlib>=3.10.9,<3.11",
    "seaborn>=0.13.2,<0.14",
    "nautilus-trader>=1.230.0,<1.231; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/BobbyAxerol/quantbt"
Repository = "https://github.com/BobbyAxerol/quantbt"
Issues = "https://github.com/BobbyAxerol/quantbt/issues"
Documentation = "https://github.com/BobbyAxerol/quantbt/tree/main/docs"
Changelog = "https://github.com/BobbyAxerol/quantbt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.0,<8.0",
    "hypothesis>=6.148,<7.0",
    "ruff>=0.14,<0.15",
    "mypy>=1.19,<2.0",
    "build>=1.3,<2.0",
    "twine>=6.2,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantbt*"]

[tool.setuptools.package-data]
quantbt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
package = true
