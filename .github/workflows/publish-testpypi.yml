name: Publish quantbt-engine to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag containing the RC version, for example v1.0.9rc1"
        required: true
        type: string
  push:
    tags:
      - "v*rc*"

permissions:
  contents: read

jobs:
  build:
    name: Build and test release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install core development environment
        run: uv sync --locked --extra optimization --extra reports --extra viz --dev

      - name: Verify TestPyPI release-channel provenance
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: uv run python tools/check_release_channel.py --channel testpypi --release-ref "$RELEASE_REF"

      - name: Check RC version against tag
        env:
          GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: uv run python tools/check_release_version.py

      - name: Run regression
        run: >-
          .venv/bin/python -m pytest -q
          --ignore=tests/test_real.py
          --ignore=tests/test_real_endpoints.py
          --ignore=tests/native_event
          --ignore=tests/test_phase47a_grid_adapter.py
          --ignore=tests/test_phase47c_grid_parity.py
          --ignore=tests/test_phase47d_grid_optimizer.py

      - name: P3 source, registry, and public API gates
        run: |
          .venv/bin/python tools/sync_source_mirror.py --check
          .venv/bin/python tools/generate_native_event_contracts.py --check
          .venv/bin/python tools/generate_product_contracts.py --check
          .venv/bin/python tools/generate_public_api_inventory.py --check
          .venv/bin/python tools/check_module_architecture.py
          .venv/bin/python tools/check_benchmark_governance.py
          .venv/bin/python tools/check_docs_links.py

      - name: Clean build directory
        run: rm -rf dist release-manifest.json release-evidence

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Validate distribution metadata
        run: uv run twine check --strict dist/*

      - name: Verify matching native companion is already on TestPyPI
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-native-testpypi-preflight
          /tmp/quantbt-native-testpypi-preflight/bin/python -m pip install --upgrade pip
          /tmp/quantbt-native-testpypi-preflight/bin/python -m pip install \
            --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "quantbt-native==${native_version}"
          /tmp/quantbt-native-testpypi-preflight/bin/python -m pip check

      - name: Inspect release surfaces
        run: |
          git ls-files --error-unmatch upgrade/implement.md
          test -n "$(find dist -maxdepth 1 -type f -name 'quantbt_engine-*.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'quantbt_engine-*-py3-none-any.whl' -print -quit)"
          if find dist -maxdepth 1 -type f \( -iname '*quantbt_native*' -o -iname '*manylinux*' \) | grep -q .; then
            echo "ERROR: native artifact found in core TestPyPI release"
            exit 1
          fi
          python "$GITHUB_WORKSPACE/tools/scan_public_secrets.py" --root "$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/tools/check_release_artifacts.py" --dist "$GITHUB_WORKSPACE/dist"

      - name: Clean wheel install smoke
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-testpypi-wheel-smoke
          /tmp/quantbt-testpypi-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/quantbt-testpypi-wheel-smoke/bin/python -m pip install \
            --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "quantbt-native==${native_version}"
          /tmp/quantbt-testpypi-wheel-smoke/bin/python -m pip install dist/quantbt_engine-*.whl
          /tmp/quantbt-testpypi-wheel-smoke/bin/python -m pip check
          cd "$(mktemp -d)"
          /tmp/quantbt-testpypi-wheel-smoke/bin/python - <<'PY'
          import pathlib
          import quantbt

          path = pathlib.Path(quantbt.__file__).resolve()
          assert "site-packages" in path.parts, path
          print(path)
          PY

      - name: Clean sdist install smoke
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-testpypi-sdist-smoke
          /tmp/quantbt-testpypi-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/quantbt-testpypi-sdist-smoke/bin/python -m pip install \
            --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "quantbt-native==${native_version}"
          /tmp/quantbt-testpypi-sdist-smoke/bin/python -m pip install dist/quantbt_engine-*.tar.gz
          /tmp/quantbt-testpypi-sdist-smoke/bin/python -m pip check
          cd "$(mktemp -d)"
          /tmp/quantbt-testpypi-sdist-smoke/bin/python - <<'PY'
          import pathlib
          import quantbt

          path = pathlib.Path(quantbt.__file__).resolve()
          assert "site-packages" in path.parts, path
          print(path)
          PY

      - name: Create release manifest
        env:
          GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          uv run python tools/create_supply_chain_report.py --output release-evidence/supply-chain.json
          uv run python tools/create_sbom.py --output release-evidence/sbom.cdx.json
          uv run python tools/create_release_manifest.py \
            --dist dist \
            --output release-manifest.json \
            --supply-chain-report release-evidence/supply-chain.json \
            --sbom release-evidence/sbom.cdx.json \
            --require-clean

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-release-manifest
          path: release-manifest.json
          if-no-files-found: error

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-supply-chain-evidence
          path: release-evidence/*
          if-no-files-found: error

  publish:
    name: Publish release candidate to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-dist
          path: dist

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: testpypi-release-manifest
          path: release-evidence

      - name: Publish with TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
