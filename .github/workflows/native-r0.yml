name: Native PyO3 Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pyo3:
    name: PyO3 build, combined wheel, parity, and RSS smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maturin
        run: python -m pip install "maturin>=1.9,<2"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install core test environment
        run: uv sync --all-extras --dev

      - name: Rust format, lint, and tests
        working-directory: rust/native_event
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build core wheel from this ref
        run: uv build --out-dir dist/core

      - name: Build native wheel
        working-directory: rust/native_event
        run: maturin build --release --out ../../dist/native

      - name: Clean combined core and native wheel install smoke
        shell: bash
        run: |
          python -m venv /tmp/quantbt-native-combined-smoke
          /tmp/quantbt-native-combined-smoke/bin/python -m pip install --upgrade pip
          /tmp/quantbt-native-combined-smoke/bin/python -m pip install dist/core/quantbt_engine-*.whl dist/native/quantbt_native-*.whl
          cd /tmp
          /tmp/quantbt-native-combined-smoke/bin/python -c "from quantbt import QuantBTEndpoint; import _quantbt_native; assert _quantbt_native.api_version() == '0.3'; assert _quantbt_native.capabilities()['r0_import_smoke']; print(QuantBTEndpoint)"

      - name: Install native wheel into core test environment
        run: uv run python -m pip install dist/native/quantbt_native-*.whl

      - name: Python-Rust parity
        env:
          QUANTBT_NATIVE_BACKEND: rust
        run: uv run pytest -q tests/native_event -k rust

      - name: Rust RSS benchmark smoke
        env:
          QUANTBT_NATIVE_BACKEND: rust
        run: uv run python benchmarks/native_event/benchmark_reactive_session.py --backend rust
