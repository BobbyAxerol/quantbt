name: Publish quantbt-engine

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra optimization --extra reports --extra viz --dev

      - name: Verify PyPI release-channel provenance
        env:
          RELEASE_REF: ${{ github.event.release.tag_name }}
        run: uv run python tools/check_release_channel.py --channel pypi --release-ref "$RELEASE_REF"

      - name: Check release version
        if: matrix.python-version == '3.12'
        run: uv run python tools/check_release_version.py

      - name: Test
        run: .venv/bin/python tools/run_test_shards.py --profile ci-core

      - name: P3 source, registry, and public API gates
        if: matrix.python-version == '3.12'
        run: |
          .venv/bin/python tools/sync_source_mirror.py --check
          .venv/bin/python tools/generate_native_event_contracts.py --check
          .venv/bin/python tools/generate_product_contracts.py --check
          .venv/bin/python tools/generate_public_api_inventory.py --check
          .venv/bin/python tools/check_module_architecture.py
          .venv/bin/python tools/check_benchmark_governance.py
          .venv/bin/python tools/check_docs_links.py

      - name: Build
        run: uv build

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --locked --dev

      - name: Verify PyPI release-channel provenance
        env:
          RELEASE_REF: ${{ github.event.release.tag_name }}
        run: uv run python tools/check_release_channel.py --channel pypi --release-ref "$RELEASE_REF"

      - name: Check release version
        run: uv run python tools/check_release_version.py

      - name: Build package
        run: |
          rm -rf dist release-manifest.json release-evidence
          uv build

      - name: Validate distribution metadata
        run: uv run twine check --strict dist/*

      - name: Verify matching native companion is already public
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-native-pypi-preflight
          /tmp/quantbt-native-pypi-preflight/bin/python -m pip install --upgrade pip
          /tmp/quantbt-native-pypi-preflight/bin/python -m pip install --only-binary=:all: "quantbt-native==${native_version}"
          /tmp/quantbt-native-pypi-preflight/bin/python -m pip check

      - name: Inspect release surfaces
        run: |
          git ls-files --error-unmatch upgrade/implement.md
          test -n "$(find dist -maxdepth 1 -type f -name 'quantbt_engine-*.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'quantbt_engine-*-py3-none-any.whl' -print -quit)"
          if find dist -maxdepth 1 -type f \( -iname '*quantbt_native*' -o -iname '*manylinux*' \) | grep -q .; then
            echo "ERROR: native artifact found in core PyPI release"
            exit 1
          fi
          python "$GITHUB_WORKSPACE/tools/scan_public_secrets.py" --root "$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/tools/check_release_artifacts.py" --dist "$GITHUB_WORKSPACE/dist"

      - name: Create release manifest
        run: |
          uv run python tools/create_supply_chain_report.py --output release-evidence/supply-chain.json
          uv run python tools/create_sbom.py --output release-evidence/sbom.cdx.json
          uv run python tools/create_release_manifest.py \
            --dist dist \
            --output release-manifest.json \
            --supply-chain-report release-evidence/supply-chain.json \
            --sbom release-evidence/sbom.cdx.json \
            --require-clean

      - name: Clean wheel install smoke
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-wheel-smoke
          /tmp/quantbt-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/quantbt-wheel-smoke/bin/python -m pip install --only-binary=:all: "quantbt-native==${native_version}"
          /tmp/quantbt-wheel-smoke/bin/python -m pip install dist/quantbt_engine-*.whl
          /tmp/quantbt-wheel-smoke/bin/python -m pip check
          cd "$(mktemp -d)"
          /tmp/quantbt-wheel-smoke/bin/python - <<'PY'
          import pathlib
          import quantbt

          path = pathlib.Path(quantbt.__file__).resolve()
          assert "site-packages" in path.parts, path
          print(path)
          PY

      - name: Clean sdist install smoke
        shell: bash
        run: |
          native_version="$(.venv/bin/python -c 'import json; from pathlib import Path; p=json.loads(Path("contracts/native_event_product_registry.json").read_text()); print(p["versions"]["native_package"]["version"])')"
          python -m venv /tmp/quantbt-sdist-smoke
          /tmp/quantbt-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/quantbt-sdist-smoke/bin/python -m pip install --only-binary=:all: "quantbt-native==${native_version}"
          /tmp/quantbt-sdist-smoke/bin/python -m pip install dist/quantbt_engine-*.tar.gz
          /tmp/quantbt-sdist-smoke/bin/python -m pip check
          cd "$(mktemp -d)"
          /tmp/quantbt-sdist-smoke/bin/python - <<'PY'
          import pathlib
          import quantbt

          path = pathlib.Path(quantbt.__file__).resolve()
          assert "site-packages" in path.parts, path
          print(path)
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-manifest
          path: release-manifest.json
          if-no-files-found: error

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: pypi-supply-chain-evidence
          path: release-evidence/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
